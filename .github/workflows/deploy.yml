# develop -> dev-sys.mustatravel.com.br   ·   main -> sys.mustatravel.com.br
# Builds the image here (the VPS has one vCPU), pushes it to GHCR, then asks the VPS to run
# /srv/travel/deploy.sh, which backs up production, swaps the container and rolls back if unhealthy.
name: Deploy

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

# One deploy per branch at a time; a newer push waits rather than cancelling one mid-swap.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/abdelrahmanm22/travelling-management
  VPS_HOST: 2.24.50.11
  # Pinned so the runner refuses to talk to anything impersonating the VPS.
  VPS_HOST_KEY: 2.24.50.11 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBTQ5fLLAw1rpVQrD7F48fvQMvx/bOM88QfPaDhNg4iu

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'development' }}
      url: ${{ github.ref_name == 'main' && 'https://sys.mustatravel.com.br' || 'https://dev-sys.mustatravel.com.br' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to the VPS
        env:
          TARGET: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
          DIGEST: ${{ steps.build.outputs.digest }}
          SSH_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_HOST_KEY" > ~/.ssh/known_hosts
          # The deploy user's key is pinned to deploy.sh; the token lets the VPS pull this private image.
          printf '%s' "$REGISTRY_TOKEN" | ssh -i ~/.ssh/deploy_key -o BatchMode=yes \
            deploy@"$VPS_HOST" "$TARGET $IMAGE@$DIGEST"
