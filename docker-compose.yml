name: travel-management

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: Developer
    ports:
      # 1433 on the host is taken by the pixel-tasks db container.
      - "1434:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      # Program.cs swallows a failed MigrateAsync, so the app must not start
      # before SQL Server accepts connections or it boots with no schema.
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  web:
    # Tagged per target: without distinct tags the dev build overwrites this
    # image and `-f docker-compose.yml up` would silently run the dev container.
    image: travel-management-web:prod
    build:
      context: .
      target: final
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Overrides appsettings.json, which holds a Windows-auth string that stays
      # valid for a native `dotnet run` on the host.
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=TravelDB;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=true;Encrypt=False"
    ports:
      # 5145 matches the http profile in launchSettings.json.
      - "5145:8080"
    volumes:
      - uploads:/app/wwwroot/Files
      - logs:/app/Logs
      # Without this every rebuild rotates the cookie keys and signs everyone out.
      - dpkeys:/home/app/.aspnet/DataProtection-Keys

volumes:
  sqldata:
  uploads:
  logs:
  dpkeys:
